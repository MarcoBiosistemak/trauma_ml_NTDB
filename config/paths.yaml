# trauma_ml -- data/path configuration (build + train both read this file).
# Paths resolve relative to the REPO ROOT (repo_root / <path>), so the
# relative paths below work locally and on the cluster, as long as the files
# sit where indicated. Absolute paths also work if you prefer.
#
# YOU MUST PROVIDE ONE FILE:
#   Put the variable-catalogue workbook at the repo root (same as local):
#     <repo>/NTDB_variable_mapping_for_trauma_ML.xlsx
#   On the cluster, e.g.:
#     scp NTDB_variable_mapping_for_trauma_ML.xlsx \
#         mcapo@atlas-edr-login-01:/scratch/mcapo/trauma_ml/
#
# AND THE RAW NTDB CSVs:
#   Expected at  <repo>/data/NTDB/<year subdir>/PUF_*.csv  e.g.
#     /scratch/mcapo/trauma_ml/data/NTDB/PUF AY 2022/CSV/PUF_TRAUMA.csv
#   If your CSVs live elsewhere, set `ntdb_root` to an absolute path.
#
# Verify before building:
#   python3 -c "import yaml,pprint; pprint.pprint(yaml.safe_load(open('config/paths.yaml')))"
#   ls <repo>/NTDB_variable_mapping_for_trauma_ML.xlsx
#   ls <repo>/data/NTDB/'PUF AY 2022/CSV'/PUF_TRAUMA.csv
# ---------------------------------------------------------------------------
variable_catalogue: NTDB_variable_mapping_for_trauma_ML.xlsx
catalogue_sheet_name: 6. NTDB variable catalogue
catalogue_header_row: 4
ntdb_root: data/NTDB
ntdb_year_subdirs:
  2019: PUF AY 2019/CSV
  2020: PUF AY 2020/CSV
  2021: PUF AY 2021/CSV
  2022: PUF AY 2022/CSV
  2024: PUF AY 2024/CSV
ntdb_tables:
  trauma: PUF_TRAUMA.csv
  ecode_lookup: PUF_ECODE_LOOKUP.csv
  aisdiagnosis: PUF_AISDIAGNOSIS.csv
  icddiagnosis: PUF_ICDDIAGNOSIS.csv
record_id_column: INC_KEY
datasets_dir: outputs/datasets
outputs_root: outputs
